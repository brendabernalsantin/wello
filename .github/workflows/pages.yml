name: Publicar Wello en GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependencias fijadas
        run: npm ci
      - name: Pruebas
        run: npm test
      - name: Comprobación
        run: npm run check
      - name: Compilar Pages
        run: npm run build:pages
        env:
          WELLO_SUPABASE_URL: ${{ vars.WELLO_SUPABASE_URL }}
          WELLO_SUPABASE_PUBLISHABLE_KEY: ${{ vars.WELLO_SUPABASE_PUBLISHABLE_KEY }}
          WELLO_DEPLOY_MODE: production
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar Pages
        id: deployment
        uses: actions/deploy-pages@v4
